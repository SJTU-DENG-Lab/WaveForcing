<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 64" role="img" aria-labelledby="title description">
  <title id="title">Wave Forcing</title>
  <desc id="description">A modular italic WF monogram with parallel strokes and separated forcing pulses.</desc>
  <defs>
    <path id="wf-rise" d="M16 48H22L34 17H28Z"/>
  </defs>
  <rect x="2" y="4" width="84" height="56" rx="14" fill="#07111f"/>
  <g transform="translate(10 0) skewX(-10)" shape-rendering="geometricPrecision">
    <!-- W · downstroke, rising wave, downstroke -->
    <rect x="7" y="17" width="8" height="31" fill="#20d7d0"/>
    <use href="#wf-rise" fill="#20d7d0"/>
    <rect x="35" y="17" width="8" height="31" fill="#70fff1"/>

    <!-- Shared W upstroke / F stem -->
    <use href="#wf-rise" transform="translate(28 0)" fill="#8b7cff"/>

    <!-- F · parallel arms with forcing tips -->
    <rect x="63" y="17" width="8" height="7" fill="#8b7cff"/>
    <path d="M71 17H75L72 24H71Z" fill="#8b7cff"/>
    <rect x="58" y="30" width="7" height="7" fill="#8b7cff"/>
    <path d="M65 30H69L66 37H65Z" fill="#8b7cff"/>
  </g>
</svg>
